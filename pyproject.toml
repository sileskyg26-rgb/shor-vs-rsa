[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shor-vs-rsa"
version = "0.1.0"
description = "Estudio de como el algoritmo de Shor rompe RSA de libro de texto (N = 15)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
